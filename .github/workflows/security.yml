name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so a vulnerability published after merge still fails a run.
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz-tlc-trace:
    name: Fuzz TLC trace reduction
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check generated traces with Atheris
        run: |
          python3.12 -m venv "$RUNNER_TEMP/fuzz"
          "$RUNNER_TEMP/fuzz/bin/pip" install --only-binary=:all: --require-hashes -r .github/requirements-fuzz.txt
          "$RUNNER_TEMP/fuzz/bin/python" tests/fuzz_tlc_trace.py -runs=10000 -max_len=64

  osv-scan:
    name: OSV vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tag is mutable, so the digest pins the image.
      - name: Scan lockfiles
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src:ro" \
            ghcr.io/google/osv-scanner:v2.5.1@sha256:8108ae94eadea5a02c9bec6e646909d5b790b44bd62d7f5b7f0b1d6d0ffc7734 \
            scan source --recursive /src
